[project]
name = "traductor"
version = "0.1.0"
description = "Text-to-SQL with schema guardrails — hallucination detection, SELECT-only allowlist, parametrized templates"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traductor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
